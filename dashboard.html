<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your family — Glowe Play</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6" />
<style> body.auth-pending .app-wrap, body.auth-pending .badge-modal { visibility: hidden; } </style>
</head>
<body class="auth-pending">

<nav>
  <div class="nav-inner">
    <div class="logo">
      <a href="index.html"><div class="logo-mark">G</div> Glowe Play</a>
    </div>
    <div class="nav-right">
      <span class="dash-user" id="dash-user"></span>
      <button class="nav-cta" id="signout-btn" type="button">Sign out</button>
    </div>
  </div>
</nav>

<main class="app-wrap">
  <div class="family-head">
    <span class="hero-eyebrow">Family account</span>
    <h1>Your family</h1>
    <p class="app-sub" id="family-email"></p>
  </div>

  <div class="app-error" id="app-error" hidden></div>
  <div class="children-grid" id="children-grid"></div>
</main>

<!-- Add child modal -->
<div class="badge-modal" id="add-modal" hidden role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="badge-modal-backdrop" data-close></div>
  <div class="badge-modal-card">
    <button class="badge-modal-close" type="button" data-close aria-label="Close">×</button>
    <h2 class="bm-title" id="add-title">Add a child</h2>
    <p class="bm-desc">Each child gets their own Adventure Year and their own hardcover book.</p>
    <form id="add-form" novalidate>
      <div class="auth-field"><label for="c-name">Child's name</label><input id="c-name" required maxlength="60" placeholder="e.g. Emma" autocomplete="off" /></div>
      <div class="auth-field"><label for="c-bd">Birthday</label><input id="c-bd" type="date" required /></div>
      <div class="add-price">$99<span> / year</span></div>
      <p class="add-note">You won't be charged yet — payment opens before launch.</p>
      <button type="submit" class="btn-primary" id="add-submit">Add child →</button>
      <p class="auth-msg" id="add-msg" role="alert" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js?v=6"></script>
<script src="js/app.js?v=6"></script>
<script>
  (function () {
    var client = GLOWE.makeClient();
    if (!client) { window.location.replace('login.html'); return; }

    var grid = document.getElementById('children-grid');
    var errBox = document.getElementById('app-error');
    var addModal = document.getElementById('add-modal');
    var AVATAR = ['#4EA8DE', '#F25F5C', '#E0AC2A', '#5CB85C', '#2E8AC4'];

    function showError(msg) { errBox.textContent = msg; errBox.hidden = false; }

    // ── Auth gate ──
    client.auth.getSession().then(function (res) {
      var session = res.data && res.data.session;
      if (!session) { window.location.replace('login.html'); return; }
      if (session.user && session.user.email) document.getElementById('family-email').textContent = session.user.email;
      document.getElementById('dash-user').textContent = session.user ? session.user.email : '';
      document.body.classList.remove('auth-pending');
      loadChildren();
    });
    client.auth.onAuthStateChange(function (_e, s) { if (!s) window.location.replace('login.html'); });
    document.getElementById('signout-btn').addEventListener('click', function () {
      client.auth.signOut().then(function () { window.location.replace('login.html'); });
    });

    // ── Children ──
    function yearLabel(child) {
      var age = GLOWE.ageFromBirthdate(child.birthdate);
      if (age == null) return 'Add a birthday to start their book';
      return 'Age ' + age + ' · The Year You Were ' + GLOWE.numberWord(age);
    }
    function childCard(child, i) {
      var initial = GLOWE.esc((child.name || '?').trim().charAt(0).toUpperCase());
      return '<a class="child-card" href="child.html?id=' + encodeURIComponent(child.id) + '">' +
        '<div class="child-avatar" style="background:' + AVATAR[i % AVATAR.length] + '">' + initial + '</div>' +
        '<h3>' + GLOWE.esc(child.name) + '</h3>' +
        '<span class="child-year">' + GLOWE.esc(yearLabel(child)) + '</span>' +
        '<span class="child-cta">Open ' + GLOWE.esc((child.name || '').split(' ')[0]) + '&rsquo;s year →</span>' +
      '</a>';
    }
    function addCard() {
      return '<button class="child-card child-add" id="open-add" type="button">' +
        '<div class="child-avatar add">＋</div>' +
        '<h3>Add a child</h3>' +
        '<span class="child-year">$99 / year · their own book</span>' +
        '<span class="child-cta">New Adventure Year →</span>' +
      '</button>';
    }
    function loadChildren() {
      client.from('children').select('*').order('created_at', { ascending: true }).then(function (res) {
        if (res.error) {
          showError('Could not load your family yet. If this is a fresh project, run supabase/schema.sql in Supabase, then refresh. (' + res.error.message + ')');
          grid.innerHTML = addCard();
          bindAdd();
          return;
        }
        var list = res.data || [];
        grid.innerHTML = list.map(childCard).join('') + addCard();
        bindAdd();
      });
    }

    // ── Add child ──
    function openAdd() { addModal.hidden = false; document.getElementById('c-name').focus(); }
    function closeAdd() { addModal.hidden = true; }
    function bindAdd() {
      var b = document.getElementById('open-add');
      if (b) b.addEventListener('click', openAdd);
    }
    addModal.querySelectorAll('[data-close]').forEach(function (el) { el.addEventListener('click', closeAdd); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !addModal.hidden) closeAdd(); });

    document.getElementById('add-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var msg = document.getElementById('add-msg');
      msg.className = 'auth-msg';
      var name = document.getElementById('c-name').value.trim();
      var bd = document.getElementById('c-bd').value;
      if (!name) { msg.textContent = "Please enter your child's name."; msg.className = 'auth-msg show error'; return; }
      if (!bd) { msg.textContent = 'Please add a birthday so we know their age.'; msg.className = 'auth-msg show error'; return; }

      var btn = document.getElementById('add-submit');
      btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Adding…';
      client.auth.getUser().then(function (u) {
        var uid = u.data && u.data.user && u.data.user.id;
        return client.from('children').insert({ owner: uid, name: name, birthdate: bd });
      }).then(function (res) {
        if (res.error) { msg.textContent = res.error.message; msg.className = 'auth-msg show error'; return; }
        closeAdd();
        document.getElementById('add-form').reset();
        loadChildren();
      }).catch(function (err) {
        msg.textContent = (err && err.message) || 'Something went wrong.'; msg.className = 'auth-msg show error';
      }).finally(function () { btn.disabled = false; btn.textContent = orig; });
    });
  })();
</script>

</body>
</html>
